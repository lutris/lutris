on: [push, pull_request]

name: Static Analysis

# Every job installs its Python tooling from uv.lock; `--locked` fails the job
# if pyproject.toml was changed without re-running `uv lock`. Every job runs on
# the Python in .python-version
env:
  UV_LOCKED: "1"

jobs:
  syntax-compat:
    name: Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Check syntax
        run: uv run --no-project python -m compileall -q lutris/ tests/

  type-checker:
    name: ty
    runs-on: ubuntu-latest
    # Generous: the runners' apt mirror is sometimes very slow
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libgirepository-2.0-dev libcairo2-dev
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python dependencies
        # The tests are type checked too, so they need pytest, and the Qt frontend PySide6
        run: uv sync --no-default-groups --group typing --group test --extra qt
      - name: Run ty
        run: |
          uv run --no-sync ty --version
          uv run --no-sync ty check --baseline ty-baseline.json --output-format github

  po-checker:
    name: Translation files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      - name: Validate .po files
        run: |
          for f in po/*.po; do
            msgfmt --check "$f" -o /dev/null
          done

  ruff-checker:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --only-group lint
      - name: Ruff version
        run: uv run --only-group lint ruff --version
      - name: Check code style
        run: uv run --only-group lint ruff check .
      - name: Check format
        run: uv run --only-group lint ruff format . --check

  unit-test:
    name: UnitTest
    runs-on: ubuntu-latest
    # Generous: the runners' apt mirror is sometimes very slow
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libgirepository-2.0-dev libcairo2-dev libgtk-3-dev \
            libgdk-pixbuf-2.0-dev libgnome-desktop-3-dev gettext \
            libegl1 libxkbcommon0 libfontconfig1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --no-default-groups --group test --extra qt
      - name: Run Unit Test
        # The Qt frontend's tests run on Qt's offscreen platform
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync pytest -m "not display"
