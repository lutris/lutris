on: [push, pull_request]

name: Static Analysis

# Every job installs its Python tooling from uv.lock; `--locked` fails the job
# if pyproject.toml was changed without re-running `uv lock`.
env:
  UV_LOCKED: "1"

jobs:
  syntax-compat:
    name: Syntax Compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax compatibility
        run: uv run --no-project python -m compileall -q lutris/

  mypy-checker:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Ubuntu dependencies
        run: |
          sudo apt update
          sudo apt-get install libdbus-1-dev pkg-config libgirepository-2.0-dev libcairo2-dev
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --no-default-groups --group typing
      - name: Run mypy analysis
        run: |
          uv run --no-sync mypy --version
          uv run --no-sync mypy . --python-version 3.10

  po-checker:
    name: Translation files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gettext
        run: sudo apt-get install -y gettext
      - name: Validate .po files
        run: |
          for f in po/*.po; do
            msgfmt --check "$f" -o /dev/null
          done

  annotation-compat:
    name: Annotation Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.10"
      - name: Check for unquoted TYPE_CHECKING annotations
        run: uv run --no-project python utils/check_annotations.py

  ruff-checker:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --only-group lint
      - name: Ruff version
        run: uv run --only-group lint ruff --version
      - name: Check code style
        run: uv run --only-group lint ruff check .
      - name: Check format
        run: uv run --only-group lint ruff format . --check

  unit-test:
    name: UnitTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Ubuntu dependencies
        run: |
          sudo apt update
          sudo apt-get install libdbus-1-dev pkg-config libgirepository-2.0-dev libcairo2-dev libgtk-3-dev libgdk-pixbuf-2.0-dev libgnome-desktop-3-dev libwebkit2gtk-4.1-dev gettext
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --no-default-groups --group test
      - name: Run Unit Test
        run: uv run --no-sync nose2 --exclude-ci
