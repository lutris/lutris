name: Flatpak

# Builds the Flatpak from packaging/flatpak and uploads the single-file bundle
# as a workflow artifact. The Build Draft Release workflow calls this one and
# attaches the bundle to a draft release
on:
  workflow_call:
    outputs:
      app_version:
        description: Lutris version from pyproject.toml
        value: ${{ jobs.prepare.outputs.app_version }}
      artifact_version:
        description: Version label of the bundle's filename
        value: ${{ jobs.prepare.outputs.artifact_version }}
      is_prerelease:
        description: Whether the version is a prerelease
        value: ${{ jobs.prepare.outputs.is_prerelease }}
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: flatpak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Resolve build versions
        id: version
        run: |
          app_version="$(uv version --short)"
          artifact_version="$(uv run --no-project --with packaging python lutris/version.py --artifact-version "$app_version")"
          if [ "$app_version" = "$artifact_version" ]; then
            is_prerelease=false
          else
            is_prerelease=true
          fi
          {
            echo "app_version=$app_version"
            echo "artifact_version=$artifact_version"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    # A plain Fedora container rather than a Flatpak CI image: updating the
    # runtimes such an image ships fails ("Invalid cross-device link")
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUNDLE: Lutris-v${{ needs.prepare.outputs.artifact_version }}-x86_64.flatpak
    steps:
      - name: Free disk space
        # The full build (Mono, DOSBox Staging, ...) needs far more room
        # than a runner leaves free by default
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Restore the flatpak-builder cache
        uses: actions/cache/restore@v6
        with:
          path: build-flatpak/state
          # The prefix names the build setup, so caches from another one (such as the
          # old Ubuntu flatpak-builder's, whose git mirrors this one can't use) never match
          key: flatpak-builder-fedora-${{ hashFiles('packaging/flatpak/**') }}-${{ github.sha }}
          restore-keys: |
            flatpak-builder-fedora-${{ hashFiles('packaging/flatpak/**') }}-
            flatpak-builder-fedora-
      - name: Build
        # In a Fedora container with its current flatpak-builder, through the same script
        # as local builds: Ubuntu's older flatpak-builder lets meson install into lib64,
        # where pkg-config doesn't look. The script also writes the bundle
        run: >
          docker run --rm --privileged -v "$PWD:/src" -w /src -e OWNER="$(id -u):$(id -g)"
          registry.fedoraproject.org/fedora:45
          packaging/flatpak/container-build.sh packaging/flatpak/net.lutris.Lutris.yml "$BUNDLE"
      - name: Save the flatpak-builder cache
        # Also after a failure or timeout, so the next run resumes from the
        # modules that did build
        if: always()
        uses: actions/cache/save@v6
        with:
          path: build-flatpak/state
          key: flatpak-builder-fedora-${{ hashFiles('packaging/flatpak/**') }}-${{ github.sha }}
      - name: Smoke test
        # Install the bundle in a clean container and check that Lutris starts in it,
        # so a bundle that builds but doesn't run is never uploaded
        run: >
          docker run --rm --privileged -v "$PWD:/src" -w /src
          registry.fedoraproject.org/fedora:45
          packaging/flatpak/smoke-test.sh "$BUNDLE"
      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUNDLE }}
          path: ${{ env.BUNDLE }}
          archive: false
          if-no-files-found: error
