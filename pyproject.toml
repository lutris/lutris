[project]
name = "lutris"
version = "0.5.23"
authors = [
    {name = "Mathieu Comandon", email = "strider@strycore.com"}
]
description = "Video game preservation platform"
readme = "README.rst"
# Locked to the Python the Flatpak's freedesktop runtime ships, so development and CI
# run exactly what users do; move it when the runtime moves
requires-python = "==3.14.*"

license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PyYAML>=6.0.3",
    "lxml>=6.1.3",
    "requests>=2.34.2",
    "Pillow>=13.0.0",
    "setproctitle>=1.3.8",
    "python-magic>=0.4.27",
    "distro>=1.9.0",
    "dbus-python>=1.5.1",
    "evdev>=2.0.0",
    "PyGObject>=3.58.0",  # For GLib and Gio, which run the main loop
    "pypresence>=4.6.2",
    "moddb>=0.16.0",
    # Optional at runtime (guarded imports), but they back real features:
    # icons extracted from Windows executables, and WebDAV save sync
    "pefile>=2024.8.26",
    "webdav4>=0.11.0",
    "packaging>=26.3",
    "pyside6-essentials>=6.12.0",
]

[project.urls]
Homepage = "https://lutris.net/"
Repository = "https://github.com/jedace07/lutris"
Issues = "https://github.com/jedace07/lutris/issues"
Releases = "https://github.com/jedace07/lutris/releases"

[project.scripts]
lutris = "lutris.launcher:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
wheel-exclude = ["lutris/locale/README.md", "lutris/locale/LINGUAS", "lutris/locale/*.pot"]
source-exclude = ["lutris/locale/*.pot"]

[tool.uv.build-backend.data]
data = "packaging/desktop"

[dependency-groups]
# Split so CI jobs can install only what they run (`uv sync --only-group lint`
# needs no native headers); `dev` is everything and is what `uv sync` installs
lint = [
    "ruff>=0.17.6",
]
typing = [
    "ty>=0.0.107",
    "types-requests>=2.33.0.20261030",
    "types-PyYAML>=6.0.12.20261113",
    "pygobject-stubs>=2.20.0",
]
test = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "typing" },
    { include-group = "test" },
]

[tool.uv]
required-version = ">=0.13.9"
# Always use uv's own Python builds (downloaded on demand), never the system's:
# they're the same everywhere and include the headers PyGObject, evdev and
# dbus-python need to compile, which many distros split into a -devel package
# The Flatpak build overrides this to use the runtime's Python
python-preference = "only-managed"
default-groups = ["dev"]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["A", "ARG", "B", "E", "F", "I", "W", "PERF", "RUF"]
ignore = [
    # Ignores that is not worth/too hard to fix
    "RUF001", #  String contains ambiguous `！` (FULLWIDTH EXCLAMATION MARK). Did you mean `!` (EXCLAMATION MARK)? - used ,mostly on tests
    "E402", # Some imports require initialization first

    # Ignores that should be fixed and removed
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "PERF401", # Use a list comprehension to create a transformed list
    "RUF100", # [*] Unused `noqa` directive (non-enabled: `C901`) - unused pylint/noqa directives that should be removed
    "PERF203", # `try`-`except` within a loop incurs performance overhead
    "RUF015", #  Prefer `next(...)` over single element slice - opinionated, but some cases could be changed
    "PERF102",# When using only the values of a dict use the `values()` method
    "RUF005", # Consider iterable unpacking instead of concatenation
    "A003", # Class attribute `id` is shadowing a Python builtin
    "B905", # `zip()` without an explicit `strict=` parameter
    "ARG002", # Unused method argument: `mock_path_exists`
    "E722", # Do not use bare `except`
    "B904", # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling
    "B008", # Do not perform function call `_try_import_moddb_library` in argument defaults; instead, perform the call within the function, or read the default from a module-level singleton variable
    "ARG005", # Unused lambda argument: `e`
    "ARG001", # Unused function argument: `args`
    "PERF402", # Use `list` or `list.copy` to create a copy of a list
    "A002", # Argument `type` is shadowing a Python builtin
    "ARG004", # Unused static method argument: `x`
    "B020", # Loop control variable `upstream_runners` overrides iterable it iterates
]
fixable = ["ALL"]
unfixable = []

[tool.ty.src]
exclude = ["**/*_pb2.py"]

[tool.ty.rules]
# Lutris reassigns attributes and variables with different types throughout
# (mypy's `assignment` check was disabled for the same reason)
invalid-assignment = "ignore"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["_test_*.py"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.pyright]

typeCheckingMode = "basic"
reportMissingImports = false
