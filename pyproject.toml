[build-system]
# setuptools >=77 is required for PEP 639 SPDX license strings, which is the
# form used by `license = "GPL-3.0-or-later"` below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lutris"
version = "0.5.23"
authors = [
    {name = "Mathieu Comandon", email = "strider@strycore.com"}
]
description = "Video game preservation platform"
readme = "README.rst"
requires-python = ">=3.10"

license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PyYAML",
    "lxml",
    "requests",
    "Pillow",
    "setproctitle",
    "python-magic",
    "distro",
    "dbus-python",
    "types-requests",
    "types-PyYAML",
    "evdev",
    "PyGObject",
    "pypresence",
    "protobuf",
    "moddb"
]

[project.urls]
Homepage = "https://lutris.net/"
Repository = "https://github.com/lutris/lutris"
Issues = "https://github.com/lutris/lutris/issues"

[tool.setuptools]
# `bin/lutris` is the runtime entry point. The meson build installs it too,
# but setuptools must as well because the AppImage (utils/appimage) and the
# RPM spec both install through setuptools.
script-files = ["bin/lutris"]
zip-safe = false
# Explicit package list (rather than packages.find) on purpose: the
# `retroarch` and `ubisoft` sub-packages below intentionally have no
# `__init__.py`, so discovery-based tooling would silently skip them even
# though the application imports their modules at runtime.
packages = [
    "lutris",
    "lutris.database",
    "lutris.gui",
    "lutris.gui.config",
    "lutris.gui.dialogs",
    "lutris.gui.installer",
    "lutris.gui.views",
    "lutris.gui.widgets",
    "lutris.installer",
    "lutris.migrations",
    "lutris.runners",
    "lutris.runners.commands",
    "lutris.scanners",
    "lutris.services",
    "lutris.util",
    "lutris.util.amazon",
    "lutris.util.battlenet",
    "lutris.util.discord",
    "lutris.util.dolphin",
    "lutris.util.egs",
    "lutris.util.graphics",
    "lutris.util.mame",
    "lutris.util.retroarch",
    "lutris.util.steam",
    "lutris.util.steam.vdf",
    "lutris.util.ubisoft",
    "lutris.util.wine",
]

[dependency-groups]
dev = [
    "ruff==0.12.1",
    "mypy==1.16.1",
    "mypy-baseline",
    "nose2",
    "pygobject-stubs>=2.17.0"
]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["A", "ARG", "B", "E", "F", "I", "W", "PERF", "RUF"]
ignore = [
    # Ignores that is not worth/too hard to fix
    "RUF001", #  String contains ambiguous `！` (FULLWIDTH EXCLAMATION MARK). Did you mean `!` (EXCLAMATION MARK)? - used ,mostly on tests
    "E402", # Module level import not at top of file - gtk stuff

    # Ignores that should be fixed and removed
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "PERF401", # Use a list comprehension to create a transformed list
    "RUF100", # [*] Unused `noqa` directive (non-enabled: `C901`) - unused pylint/noqa directives that should be removed
    "PERF203", # `try`-`except` within a loop incurs performance overhead
    "RUF015", #  Prefer `next(...)` over single element slice - opinionated, but some cases could be changed
    "PERF102",# When using only the values of a dict use the `values()` method
    "RUF005", # Consider iterable unpacking instead of concatenation
    "A003", # Class attribute `id` is shadowing a Python builtin
    "B905", # `zip()` without an explicit `strict=` parameter
    "ARG002", # Unused method argument: `mock_path_exists`
    "E722", # Do not use bare `except`
    "B904", # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling
    "B008", # Do not perform function call `_try_import_moddb_library` in argument defaults; instead, perform the call within the function, or read the default from a module-level singleton variable
    "ARG005", # Unused lambda argument: `e`
    "ARG001", # Unused function argument: `args`
    "PERF402", # Use `list` or `list.copy` to create a copy of a list
    "A002", # Argument `type` is shadowing a Python builtin
    "ARG004", # Unused static method argument: `x`
    "B020", # Loop control variable `upstream_runners` overrides iterable it iterates
]
fixable = ["ALL"]
unfixable = []

[tool.mypy]
python_version = "3.10"
packages = [
    "lutris",
    "tests",
]
exclude = [
    ".*_pb2.py",  # Any automatically generated protobuf files
    "venv",
    "^build/",  # setuptools build output
]
disable_error_code = [
    "no-redef",  # Allow variable redefinition
    "has-type",  # Ignore when variable types cannot be determined.
    "dict-item",  # Dictionaries are always fully dynamic
    "var-annotated",  # Never require type annotations
    "assignment",  # Allow incompatible types in assignment (used heavily in lutris class structure).
]
allow_redefinition = true
follow_imports = "silent"
ignore_missing_imports = true

[tool.mypy-baseline]
# --baseline-path: the file where the baseline should be stored
baseline_path = ".mypy_baseline"
# --depth: cut path names longer than that many directories deep
depth = 40
# --allow-unsynced: do not fail for unsynced resolved errors
allow_unsynced = true
# --preserve-position: do not remove error position from the baseline
preserve_position = false
# --hide-stats: do not show stats and messages at the end
hide_stats = false
# --no-colors: do not use colors in stats
no_colors = false
# --ignore: regexes for error messages to ignore
ignore = []

[[tool.mypy.overrides]]
module = [
    "lutris.api",
    "lutris.cache",
    "lutris.config",
    "lutris.database.*",
    "lutris.exception_backstops",
    "lutris.exceptions",
    "lutris.gui.dialogs",
    "lutris.monitored_command",
    "lutris.runners",
    "lutris.scanners.default_installers",
    "lutris.services.mame",
    "lutris.settings",
    "lutris.sysoptions",
    "lutris.util",
    "lutris.util.busy",
    "lutris.util.datapath",
    "lutris.util.discord.base",
    "lutris.util.graphics.*",
    "lutris.util.http",
    "lutris.util.jobs",
    "lutris.util.log",
    "lutris.util.flatpak",
    "lutris.util.retroarch.core_config",
    "lutris.util.settings",
    "lutris.util.standalone_scripts",
    "lutris.util.steam.*",
    "lutris.util.shell",
    "lutris.util.system",
    "lutris.util.timer",
    "lutris.util.ubisoft.consts",
    "lutris.util.urlhandler",
    "lutris.util.wine.d3d_extras",
    "lutris.util.wine.dgvoodoo2",
    "lutris.util.xdgshortcuts",
    "lutris.util.yaml",
    "setup",
    "utils.bios_format",
    "utils.meson_post_install",
]
# Equivalent to strict = true for per-module config
# Use strict = true when https://github.com/python/mypy/issues/11401 is fixed
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true

[tool.pyright]

typeCheckingMode = "basic"
reportMissingImports = false
